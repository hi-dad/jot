name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # to publish a release when main changes
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Build QuickNote.app and QuickNote.dmg
        run: ./build.sh dist

      - name: Verify bundle
        run: |
          test -x build/QuickNote.app/Contents/MacOS/QuickNote
          plutil -lint build/QuickNote.app/Contents/Info.plist
          codesign --verify --verbose build/QuickNote.app
          lipo build/QuickNote.app/Contents/MacOS/QuickNote -verify_arch arm64 x86_64
          hdiutil verify dist/QuickNote.dmg

      - name: Smoke test (hotkey opens the capture box)
        run: |
          open build/QuickNote.app
          sleep 3
          swift ci/smoke-test.swift

      - name: App log
        if: always()
        run: log show --last 5m --info --predicate 'process == "QuickNote"' | tail -50

      - uses: actions/upload-artifact@v4
        with:
          name: QuickNote
          path: dist/QuickNote.dmg

      # Every update to main becomes the new download behind the README button.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          gh release create "build-$GITHUB_RUN_NUMBER" dist/QuickNote.dmg \
            --target "$GITHUB_SHA" --latest \
            --title "QuickNote $version (build $GITHUB_RUN_NUMBER)" --generate-notes

  # Checks tools/setup-signing.sh works and that builds signed with it keep the same identity,
  # which is what lets macOS remember QuickNote's permissions across rebuilds.
  stable-signing:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Set up a throwaway keychain
        run: |
          security create-keychain -p ci ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$HOME/Library/Keychains/ci.keychain-db" >> "$GITHUB_ENV"

      - name: Run setup-signing.sh (twice, to check it's safe to re-run)
        env:
          TRUST_AS_ADMIN: 1
        run: |
          ./tools/setup-signing.sh
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" >/dev/null
          ./tools/setup-signing.sh | grep "already set up"

      - name: Two builds share one signing identity
        run: |
          ./build.sh dist | tee first.log
          grep 'Signed as "QuickNote Local Signing"' first.log
          codesign -d -r- build/QuickNote.app 2>&1 | grep designated > first.req
          ./build.sh dist >/dev/null
          codesign -d -r- build/QuickNote.app 2>&1 | grep designated > second.req
          cat first.req
          grep -q 'certificate leaf' first.req
          diff first.req second.req
          codesign --verify --strict --verbose build/QuickNote.app
