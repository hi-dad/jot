name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # to publish a release when main changes
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Build QuickNote.app and QuickNote.dmg
        run: ./build.sh dist

      - name: Verify bundle
        run: |
          test -x build/QuickNote.app/Contents/MacOS/QuickNote
          plutil -lint build/QuickNote.app/Contents/Info.plist
          codesign --verify --verbose build/QuickNote.app
          lipo build/QuickNote.app/Contents/MacOS/QuickNote -verify_arch arm64 x86_64
          hdiutil verify dist/QuickNote.dmg

      - name: Smoke test (hotkey opens the capture box)
        run: |
          open build/QuickNote.app
          sleep 3
          swift ci/smoke-test.swift

      - name: App log
        if: always()
        run: log show --last 5m --info --predicate 'process == "QuickNote"' | tail -50

      - uses: actions/upload-artifact@v4
        with:
          name: QuickNote
          path: dist/QuickNote.dmg

      # Every update to main becomes the new download behind the README button.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          gh release create "build-$GITHUB_RUN_NUMBER" dist/QuickNote.dmg \
            --target "$GITHUB_SHA" --latest \
            --title "QuickNote $version (build $GITHUB_RUN_NUMBER)" --generate-notes
