name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (tagged v<version from Info.plist>)
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # to publish a release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Build QuickNote.app and QuickNote.dmg
        run: ./build.sh dist

      - name: Verify bundle
        run: |
          test -x build/QuickNote.app/Contents/MacOS/QuickNote
          plutil -lint build/QuickNote.app/Contents/Info.plist
          codesign --verify --verbose build/QuickNote.app
          lipo build/QuickNote.app/Contents/MacOS/QuickNote -verify_arch arm64 x86_64
          hdiutil verify dist/QuickNote.dmg

      - name: Smoke test (hotkey opens the capture box)
        run: |
          open build/QuickNote.app
          sleep 3
          swift ci/smoke-test.swift

      - name: App log
        if: always()
        run: log show --last 5m --info --predicate 'process == "QuickNote"' | tail -50

      - uses: actions/upload-artifact@v4
        with:
          name: QuickNote
          path: dist/QuickNote.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || tag="v$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          gh release create "$tag" dist/QuickNote.dmg --target "$GITHUB_SHA" --title "QuickNote $tag" --generate-notes
