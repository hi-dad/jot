name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Build QuickNote.app
        run: ./build.sh

      - name: Verify bundle
        run: |
          test -x build/QuickNote.app/Contents/MacOS/QuickNote
          plutil -lint build/QuickNote.app/Contents/Info.plist
          codesign --verify --verbose build/QuickNote.app

      - name: Smoke test (hotkey opens the capture box)
        run: |
          open build/QuickNote.app
          sleep 3
          swift ci/smoke-test.swift

      - name: App log
        if: always()
        run: log show --last 5m --info --predicate 'process == "QuickNote"' | tail -50

      - name: Zip app
        run: ditto -c -k --keepParent build/QuickNote.app build/QuickNote.zip

      - uses: actions/upload-artifact@v4
        with:
          name: QuickNote
          path: build/QuickNote.zip
